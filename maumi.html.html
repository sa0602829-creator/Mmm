<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>마음이</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 50%, #EDE9FE 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
  }

  /* 배경 블롭 */
  .blob { position: fixed; border-radius: 50%; pointer-events: none; }
  .blob1 { width:220px; height:220px; background:rgba(147,197,253,.22); top:-60px; left:-60px; animation: fa 6s ease-in-out infinite; }
  .blob2 { width:180px; height:180px; background:rgba(196,181,253,.2); bottom:-40px; right:-40px; animation: fa 7s ease-in-out infinite .5s; }
  .blob3 { width:100px; height:100px; background:rgba(165,243,252,.18); top:35%; right:5%; animation: fa 5s ease-in-out infinite 1s; }

  @keyframes fa { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  @keyframes bounce { 0%,80%,100%{transform:scale(0);opacity:.3} 40%{transform:scale(1);opacity:1} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* 앱 카드 */
  #app {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    background: rgba(255,255,255,.93);
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* 헤더 */
  .header {
    background: linear-gradient(135deg, #60A5FA, #818CF8);
    padding: 16px 18px 0;
    flex-shrink: 0;
  }
  .h-top { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .h-avatar {
    width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; flex-shrink:0;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .h-name { font-family:'Jua',sans-serif; font-size:22px; color:#fff; letter-spacing:1px; }
  .h-sub  { font-size:11px; color:rgba(255,255,255,.9); margin-top:2px; }

  /* 탭 */
  .tabs { display:flex; gap:3px; }
  .tab-btn {
    flex:1; padding:9px 0; border:none;
    background:rgba(255,255,255,.2);
    color:rgba(255,255,255,.85);
    border-radius:10px 10px 0 0;
    cursor:pointer; font-size:12px;
    font-family:'Nanum Gothic',sans-serif; font-weight:700;
    transition: all .2s;
  }
  .tab-btn.active { background:rgba(255,255,255,.95); color:#3B82F6; }

  /* 화면 전환 */
  .screen { display:none; flex:1; flex-direction:column; overflow:hidden; min-height:0; }
  .screen.show { display:flex; }

  /* 기분 선택 */
  .mood-box {
    padding:10px 14px;
    background:rgba(239,246,255,.8);
    border-bottom:1px solid rgba(147,197,253,.3);
    flex-shrink:0;
  }
  .mood-title { font-family:'Jua',sans-serif; font-size:13px; color:#3B82F6; text-align:center; margin-bottom:8px; font-weight:700; }
  .mood-row { display:flex; gap:5px; justify-content:center; }
  .mood-btn {
    border:2px solid rgba(147,197,253,.4); border-radius:14px;
    padding:6px 10px; cursor:pointer; text-align:center; min-width:52px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:transparent; font-family:'Nanum Gothic',sans-serif;
    transition: transform .15s;
  }
  .mood-btn:active { transform:scale(.93); }
  .mood-emoji { font-size:24px; }
  .mood-label { font-size:10px; color:#64748B; font-weight:700; }

  /* 메시지 목록 */
  .msg-list {
    flex:1; overflow-y:auto; padding:12px 14px;
    display:flex; flex-direction:column; gap:10px;
    min-height:0;
  }
  .msg-list::-webkit-scrollbar { width:4px; }
  .msg-list::-webkit-scrollbar-thumb { background:#93C5FD; border-radius:10px; }

  .msg-row { display:flex; align-items:flex-end; gap:8px; }
  .msg-row.user { justify-content:flex-end; }
  .msg-row.ai   { justify-content:flex-start; }

  .av-sm {
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg,#60A5FA,#818CF8);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0;
    box-shadow:0 2px 6px rgba(96,165,250,.3);
  }
  .bubble {
    max-width:78%; padding:11px 15px; border-radius:20px;
    font-size:14px; line-height:1.8;
    font-family:'Nanum Gothic',sans-serif; font-weight:700;
    word-break:break-word;
  }
  .bubble.ai {
    background:linear-gradient(135deg,#EFF6FF,#EDE9FE);
    color:#374151;
    border-radius:4px 20px 20px 20px;
    border:1.5px solid rgba(147,197,253,.4);
  }
  .bubble.user {
    background:linear-gradient(135deg,#60A5FA,#818CF8);
    color:#fff;
    border-radius:20px 4px 20px 20px;
  }

  /* 타이핑 애니메이션 */
  .typing-bubble { display:flex; gap:5px; align-items:center; padding:13px 18px !important; }
  .dot {
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:#60A5FA; animation:bounce 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay:.2s; }
  .dot:nth-child(3) { animation-delay:.4s; }

  /* 빠른 버튼 */
  .quick-row {
    display:flex; gap:6px; padding:8px 10px;
    overflow-x:auto; border-top:1px solid rgba(147,197,253,.25);
    flex-shrink:0;
  }
  .quick-row::-webkit-scrollbar { display:none; }
  .q-btn {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:7px 10px;
    background:linear-gradient(135deg,rgba(239,246,255,.95),rgba(237,233,254,.95));
    border:1.5px solid rgba(147,197,253,.45); border-radius:13px;
    cursor:pointer; white-space:nowrap; flex-shrink:0;
    font-family:'Nanum Gothic',sans-serif;
    transition:transform .15s;
  }
  .q-btn:active { transform:scale(.93); }
  .q-emoji { font-size:18px; }
  .q-label { font-size:10px; color:#3B82F6; font-weight:700; }

  /* 입력창 */
  .input-area {
    display:flex; align-items:center; gap:8px;
    padding:10px 12px;
    background:rgba(255,255,255,.97);
    border-top:1.5px solid rgba(147,197,253,.2);
    flex-shrink:0; min-height:62px; max-height:62px;
  }
  #chat-input {
    flex:1; height:38px; padding:0 14px; border-radius:20px;
    border:2px solid rgba(147,197,253,.45);
    background:rgba(239,246,255,.8);
    font-size:14px; font-family:'Nanum Gothic',sans-serif;
    color:#374151; outline:none; min-width:0;
    transition: border-color .2s;
  }
  #chat-input:focus { border-color:#60A5FA; }
  #send-btn {
    width:40px; height:40px; min-width:40px; border-radius:50%; border:none;
    background:linear-gradient(135deg,#60A5FA,#818CF8);
    color:#fff; font-size:20px; font-weight:900;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:opacity .2s;
  }
  #send-btn:disabled { opacity:.35; }

  /* 스크롤 화면 (루틴/보호자) */
  .scroll-screen { flex:1; overflow-y:auto; padding:16px 14px; }
  .scroll-screen::-webkit-scrollbar { width:4px; }
  .scroll-screen::-webkit-scrollbar-thumb { background:#93C5FD; border-radius:10px; }

  .sec-title { font-family:'Jua',sans-serif; font-size:19px; color:#3B82F6; text-align:center; }
  .d-count { font-size:12px; color:#94A3B8; text-align:center; margin-top:3px; margin-bottom:8px; font-weight:700; }

  .p-bar { height:9px; background:rgba(147,197,253,.25); border-radius:9px; margin-bottom:10px; overflow:hidden; }
  .p-fill { height:100%; background:linear-gradient(90deg,#60A5FA,#818CF8); border-radius:9px; transition:width .4s ease; }

  .all-done {
    text-align:center; background:linear-gradient(135deg,#60A5FA,#818CF8);
    color:#fff; padding:12px; border-radius:14px;
    font-family:'Jua',sans-serif; font-size:16px; margin-bottom:10px;
  }

  /* 체크리스트 */
  .c-list { display:flex; flex-direction:column; gap:8px; }
  .c-item {
    display:flex; align-items:center; border-radius:16px; overflow:hidden;
    border:2px solid rgba(147,197,253,.35); background:rgba(239,246,255,.8);
    transition:all .2s;
  }
  .c-item.done {
    background:linear-gradient(135deg,rgba(219,234,254,.6),rgba(237,233,254,.6));
    border-color:rgba(129,140,248,.4);
  }
  .c-main {
    flex:1; display:flex; align-items:center; gap:10px;
    padding:12px 14px; border:none; background:transparent;
    cursor:pointer; font-family:'Nanum Gothic',sans-serif; text-align:left;
  }
  .c-emoji { font-size:22px; }
  .c-label { flex:1; font-size:14px; font-weight:700; color:#374151; }
  .c-item.done .c-label { color:#93C5FD; text-decoration:line-through; }
  .c-box {
    width:24px; height:24px; border-radius:50%;
    border:2px solid rgba(147,197,253,.5);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-size:13px; color:#fff; font-weight:900;
    transition:all .2s;
  }
  .c-item.done .c-box { background:linear-gradient(135deg,#60A5FA,#818CF8); border-color:transparent; }
  .del-btn {
    padding:0 12px; align-self:stretch; border:none;
    background:rgba(252,165,165,.15); color:#F87171;
    cursor:pointer; font-size:15px; font-weight:900;
  }

  /* 버튼들 */
  .add-row { display:flex; gap:8px; margin-top:10px; }
  .add-btn {
    padding:10px 16px; background:linear-gradient(135deg,#60A5FA,#818CF8);
    border:none; border-radius:12px; color:#fff; font-weight:700;
    font-size:13px; cursor:pointer; font-family:'Nanum Gothic',sans-serif; white-space:nowrap;
  }
  .out-btn {
    flex:1; padding:9px 0; border:2px dashed rgba(147,197,253,.5);
    border-radius:12px; background:transparent; color:#3B82F6;
    font-weight:700; font-size:12px; cursor:pointer; font-family:'Nanum Gothic',sans-serif;
  }
  .out-btn:active, .add-btn:active, .del-btn:active { transform:scale(.95); }

  /* 루틴 입력 */
  .routine-inp {
    flex:1; height:38px; padding:0 13px; border-radius:12px;
    border:2px solid rgba(147,197,253,.4); background:rgba(255,255,255,.9);
    font-size:13px; font-family:'Nanum Gothic',sans-serif; color:#374151; outline:none;
  }
  .routine-inp:focus { border-color:#60A5FA; }

  /* 보호자 */
  .g-desc { font-size:12px; color:#94A3B8; text-align:center; margin-top:4px; }
  .g-card {
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; background:rgba(239,246,255,.8);
    border:2px solid rgba(147,197,253,.35); border-radius:16px; margin-bottom:10px;
  }
  .g-name { font-size:15px; font-weight:700; color:#3B82F6; font-family:'Jua',sans-serif; }
  .g-phone { font-size:11px; color:#94A3B8; margin-top:2px; }
  .g-send-btn {
    padding:7px 12px; background:linear-gradient(135deg,#60A5FA,#818CF8);
    border:none; border-radius:10px; color:#fff; font-weight:700;
    font-size:12px; cursor:pointer; font-family:'Nanum Gothic',sans-serif; white-space:nowrap;
  }
  .g-del-btn {
    width:30px; height:30px; border-radius:50%;
    border:none; background:rgba(252,165,165,.15); color:#F87171;
    cursor:pointer; font-size:13px; font-weight:900; margin-left:4px;
    display:flex; align-items:center; justify-content:center;
  }
  .sent-box {
    margin-top:12px; padding:12px 14px;
    background:rgba(239,246,255,.9); border:2px solid rgba(147,197,253,.4);
    border-radius:14px; margin-bottom:12px;
  }
  .sent-title { font-size:13px; font-weight:700; color:#3B82F6; margin-bottom:6px; }
  .sent-body { font-size:12px; color:#374151; line-height:1.7; white-space:pre-wrap; }
  .add-guard {
    margin-top:16px; padding:14px; background:rgba(239,246,255,.7);
    border-radius:16px; border:2px dashed rgba(147,197,253,.4);
  }
  .sec-title2 { font-family:'Jua',sans-serif; font-size:15px; color:#3B82F6; margin-bottom:10px; }
  .guard-inp {
    width:100%; padding:10px 13px; border-radius:12px;
    border:2px solid rgba(147,197,253,.4); background:rgba(255,255,255,.9);
    font-size:13px; font-family:'Nanum Gothic',sans-serif; color:#374151;
    margin-bottom:8px; display:block; outline:none;
  }
  .guard-inp:focus { border-color:#60A5FA; }
  .btn-row { display:flex; gap:8px; margin-top:12px; }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div id="app">

  <!-- 헤더 -->
  <div class="header">
    <div class="h-top">
      <div class="h-avatar">😊</div>
      <div>
        <div class="h-name">마음이</div>
        <div class="h-sub">네 진심, 내가 통역해줄게 💙</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('chat', this)">💬 대화</button>
      <button class="tab-btn" onclick="switchTab('daily', this)">☀️ 루틴</button>
      <button class="tab-btn" onclick="switchTab('guardian', this)">👨‍👩‍👧 보호자</button>
    </div>
  </div>

  <!-- ── 채팅 화면 ── -->
  <div id="screen-chat" class="screen show">

    <!-- 기분 선택 -->
    <div class="mood-box" id="mood-box">
      <div class="mood-title">지금 기분이 어때? 😊</div>
      <div class="mood-row">
        <button class="mood-btn" style="background:rgba(147,197,253,.35)" onclick="sendMsg('나 지금 기분이 좋아')">
          <span class="mood-emoji">😊</span><span class="mood-label">좋아</span>
        </button>
        <button class="mood-btn" style="background:rgba(165,243,252,.35)" onclick="sendMsg('나 지금 기분이 그냥')">
          <span class="mood-emoji">😐</span><span class="mood-label">그냥</span>
        </button>
        <button class="mood-btn" style="background:rgba(196,181,253,.35)" onclick="sendMsg('나 지금 슬퍼')">
          <span class="mood-emoji">😢</span><span class="mood-label">슬퍼</span>
        </button>
        <button class="mood-btn" style="background:rgba(252,165,165,.3)" onclick="sendMsg('나 지금 화나')">
          <span class="mood-emoji">😡</span><span class="mood-label">화나</span>
        </button>
        <button class="mood-btn" style="background:rgba(110,231,183,.3)" onclick="sendMsg('나 지금 무서워')">
          <span class="mood-emoji">😰</span><span class="mood-label">무서워</span>
        </button>
      </div>
    </div>

    <!-- 메시지 목록 -->
    <div class="msg-list" id="msg-list"></div>

    <!-- 빠른 버튼 -->
    <div class="quick-row">
      <button class="q-btn" onclick="sendMsg('배고파')"><span class="q-emoji">😋</span><span class="q-label">배고파</span></button>
      <button class="q-btn" onclick="sendMsg('졸려')"><span class="q-emoji">😴</span><span class="q-label">졸려</span></button>
      <button class="q-btn" onclick="sendMsg('슬퍼')"><span class="q-emoji">😢</span><span class="q-label">슬퍼</span></button>
      <button class="q-btn" onclick="sendMsg('화가 나')"><span class="q-emoji">😡</span><span class="q-label">화났어</span></button>
      <button class="q-btn" onclick="sendMsg('오늘 옷 어때')"><span class="q-emoji">👗</span><span class="q-label">패션 봐줘</span></button>
      <button class="q-btn" onclick="sendMsg('누군가한테 말 전하고 싶어')"><span class="q-emoji">💬</span><span class="q-label">말 전하고 싶어</span></button>
      <button class="q-btn" onclick="sendMsg('씻기 싫어')"><span class="q-emoji">🛁</span><span class="q-label">씻기 싫어</span></button>
      <button class="q-btn" onclick="sendMsg('몸이 아파')"><span class="q-emoji">🤒</span><span class="q-label">몸이 이상해</span></button>
      <button class="q-btn" onclick="sendMsg('무서워')"><span class="q-emoji">😰</span><span class="q-label">무서워</span></button>
      <button class="q-btn" onclick="sendMsg('외로워')"><span class="q-emoji">🥺</span><span class="q-label">외로워</span></button>
    </div>

    <!-- 입력창 -->
    <div class="input-area">
      <input id="chat-input" type="text" placeholder="편하게 말해봐 😊" onkeydown="if(event.key==='Enter') sendMsg(this.value)">
      <button id="send-btn" onclick="sendMsg(document.getElementById('chat-input').value)">→</button>
    </div>
  </div>

  <!-- ── 루틴 화면 ── -->
  <div id="screen-daily" class="screen">
    <div class="scroll-screen">
      <div class="sec-title">오늘 할 일 🌈</div>
      <div class="d-count" id="routine-count">0/7 완료 ✨</div>
      <div class="p-bar"><div class="p-fill" id="p-fill" style="width:0%"></div></div>
      <div id="all-done-msg" style="display:none" class="all-done">와! 다 했어! 진짜 최고야! 🎉</div>
      <div class="c-list" id="routine-list"></div>
      <div class="add-row" id="routine-add-row" style="display:none">
        <input class="routine-inp" id="new-routine" placeholder="새 할 일..." onkeydown="if(event.key==='Enter') addRoutine()">
        <button class="add-btn" onclick="addRoutine()">추가</button>
      </div>
      <div class="btn-row">
        <button class="out-btn" onclick="toggleEditRoutine()" id="edit-btn">✏️ 편집</button>
        <button class="out-btn" onclick="resetRoutine()">🔄 초기화</button>
      </div>
    </div>
  </div>

  <!-- ── 보호자 화면 ── -->
  <div id="screen-guardian" class="screen">
    <div class="scroll-screen">
      <div class="sec-title">보호자 연락처 👨‍👩‍👧</div>
      <div class="g-desc">버튼 누르면 메시지 만들어줘요 💙</div>
      <div id="sent-box" class="sent-box" style="display:none">
        <div class="sent-title">📨 전달할 메시지 (복사해서 보내줘!)</div>
        <div class="sent-body" id="sent-body"></div>
        <button class="out-btn" style="margin-top:8px;width:100%" onclick="document.getElementById('sent-box').style.display='none'">닫기</button>
      </div>
      <div id="guardian-list" style="margin-top:12px"></div>
      <div class="add-guard">
        <div class="sec-title2">보호자 추가 ➕</div>
        <input class="guard-inp" id="new-gname" placeholder="이름 (예: 엄마)">
        <input class="guard-inp" id="new-gphone" placeholder="전화번호" type="tel">
        <button class="add-btn" onclick="addGuardian()">추가하기</button>
      </div>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════
// 키워드 응답 데이터
// ══════════════════════════════════════════════════════════════
const RULES = [
  { keys:["안녕","반가워","처음","hello","hi"], reply:"안녕! 나는 마음이야 😊\n네가 하고 싶었던 말의 진심을\n내가 사람들에게 통역해줄게!\n편하게 말해봐 💙" },
  { keys:["고마워","감사","고맙"], reply:"고맙다고 해줘서 나도 좋아 😊\n또 언제든지 말해줘!" },
  { keys:["잘자","굿나잇","자야겠","잘게"], reply:"잘 자~ 🌙 오늘 수고했어!\n내일 또 얘기하자" },

function getReply(text) {
  const t = text.replace(/\s/g,'').toLowerCase();
  for (const rule of RULES) {
    if (rule.keys.some(k => t.includes(k.replace(/\s/g,'')))) return rule.reply;
  }
  return "그렇구나~\n혹시 이런 말 하고 싶었던 거야?\n'저 지금 도움이 필요해요'\n조금 더 말해줄래? 😊";
}

const msgList = document.getElementById('msg-list');

function addMsg(role, text) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  if (role === 'ai') {
    const av = document.createElement('div');
    av.className = 'av-sm'; av.textContent = '😊';
    row.appendChild(av);
  }
  const bub = document.createElement('div');
  bub.className = 'bubble ' + role;
  bub.innerHTML = text.split('\n').map(l => `<span>${l}</span>`).join('<br>');
  row.appendChild(bub);
  msgList.appendChild(row);
  msgList.scrollTop = msgList.scrollHeight;
  return row;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row ai'; row.id = 'typing-row';
  const av = document.createElement('div');
  av.className = 'av-sm'; av.textContent = '😊';
  row.appendChild(av);
  const bub = document.createElement('div');
  bub.className = 'bubble ai typing-bubble';
  bub.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  row.appendChild(bub);
  msgList.appendChild(row);
  msgList.scrollTop = msgList.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-row');
  if (t) t.remove();
}

let moodHidden = false;
function sendMsg(text) {
  if (!text || !text.trim()) return;
  document.getElementById('chat-input').value = '';
  if (!moodHidden) {
    document.getElementById('mood-box').style.display = 'none';
    moodHidden = true;
  }
  addMsg('user', text.trim());
  showTyping();
  setTimeout(() => {
    hideTyping();
    addMsg('ai', getReply(text));
  }, 600);
}

document.getElementById('send-btn').addEventListener('click', () => {

function switchTab(tab, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('show');
  btn.classList.add('active');
}

let routine = [
  { id:1, e:'🌅', l:'일어나기', done:false },
  { id:2, e:'🪥', l:'양치하기', done:false },
  { id:3, e:'🚿', l:'씻기',     done:false },
  { id:4, e:'👗', l:'옷 입기',  done:false },
  { id:5, e:'🍳', l:'아침 먹기',done:false },
  { id:6, e:'🎒', l:'가방 챙기기',done:false },
  { id:7, e:'😊', l:'오늘도 파이팅!',done:false },
];
let editMode = false;

function renderRoutine() {
  const list = document.getElementById('routine-list');
  list.innerHTML = '';
  const done = routine.filter(r=>r.done).length;
  document.getElementById('routine-count').textContent = done + '/' + routine.length + ' 완료 ✨';
  document.getElementById('p-fill').style.width = (routine.length ? done/routine.length*100 : 0) + '%';
  document.getElementById('all-done-msg').style.display = (done === routine.length && routine.length > 0) ? 'block' : 'none';

  routine.forEach(r => {
    const item = document.createElement('div');
    item.className = 'c-item' + (r.done ? ' done' : '');
    const btn = document.createElement('button');
    btn.className = 'c-main';
    btn.innerHTML = `<span class="c-emoji">${r.e}</span><span class="c-label">${r.l}</span><div class="c-box">${r.done ? '✓' : ''}</div>`;
    btn.onclick = () => { r.done = !r.done; renderRoutine(); };
    item.appendChild(btn);
    if (editMode) {
      const del = document.createElement('button');
      del.className = 'del-btn'; del.textContent = '✕';
      del.onclick = () => { routine = routine.filter(x=>x.id!==r.id); renderRoutine(); };
      item.appendChild(del);
    }
    list.appendChild(item);
  });
}

function toggleEditRoutine() {
  editMode = !editMode;
  document.getElementById('routine-add-row').style.display = editMode ? 'flex' : 'none';
  document.getElementById('edit-btn').textContent = editMode ? '✓ 완료' : '✏️ 편집';
  renderRoutine();
}

function addRoutine() {
  const val = document.getElementById('new-routine').value.trim();
  if (!val) return;
  routine.push({ id: Date.now(), e:'✅', l:val, done:false });
  document.getElementById('new-routine').value = '';
  renderRoutine();
}

function resetRoutine() {
  routine = [
    { id:1, e:'🌅', l:'일어나기', done:false },
    { id:2, e:'🪥', l:'양치하기', done:false },
    { id:3, e:'🚿', l:'씻기',     done:false },
    { id:4, e:'👗', l:'옷 입기',  done:false },
    { id:5, e:'🍳', l:'아침 먹기',done:false },
    { id:6, e:'🎒', l:'가방 챙기기',done:false },
    { id:7, e:'😊', l:'오늘도 파이팅!',done:false },
  ];
  renderRoutine();
}

  const list = document.getElementById('guardian-list');
  list.innerHTML = '';
  guardians.forEach(g => {
    const card = document.createElement('div');
    card.className = 'g-card';
    card.innerHTML = `
      <div class="g-info">
        <div class="g-name">${g.name}</div>
        <div class="g-phone">${g.phone}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="g-send-btn" onclick="notifyGuardian(${g.id})">💌 전달</button>
        <button class="g-del-btn" onclick="deleteGuardian(${g.id})">✕</button>
      </div>`;
    list.appendChild(card);
  });
}

function notifyGuardian(id) {
  const g = guardians.find(x=>x.id===id);
  const msgItems = document.querySelectorAll('.bubble.user');
  const lastMsg = msgItems.length ? msgItems[msgItems.length-1].textContent : '';
  const msg = `[마음이 알림]\n${g.name}님, 지금 도움이 필요해요!\n최근 한 말: "${lastMsg}"`;
  document.getElementById('sent-body').textContent = msg;
  document.getElementById('sent-box').style.display = 'block';
  document.getElementById('sent-box').scrollIntoView({behavior:'smooth'});
}

function deleteGuardian(id) {
  guardians = guardians.filter(x=>x.id!==id);
  renderGuardians();
}

function addGuardian() {
  const name  = document.getElementById('new-gname').value.trim();
  const phone = document.getElementById('new-gphone').value.trim();
  if (!name || !phone) return;
  guardians.push({ id: Date.now(), name, phone });
  document.getElementById('new-gname').value = '';
  document.getElementById('new-gphone').value = '';
  renderGuardians();
}

renderGuardians();
</script>
</body>
</html>
